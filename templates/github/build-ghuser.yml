# Copy to .github/workflows/build-ghuser.yml in a GitHub-hosted project.
# Same image, same command as GitLab and local Docker. Needs the image to be
# pullable from GitHub: mirror it to ghcr.io, or make the GitLab registry public.
#
# Every push: build + verify. Tag v1.2.3: also attach the .yak and .ghuser files
# to a GitHub Release.

name: build-ghuser

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/raccoon-ncku/ghuser-builder:1.0.0   # <- where you mirrored it
    env:
      GHUSER_YAK_NAME: my-tool                           # empty = no .yak
    steps:
      - uses: actions/checkout@v4
      - run: ghuser-build components dist                # version comes from the tag
      - uses: actions/upload-artifact@v4
        with:
          name: ghuser
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.yak
            dist/ghuser/*.ghuser
