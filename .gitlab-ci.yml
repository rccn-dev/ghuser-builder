# Pipeline for ghuser-builder itself: build the image, test it on the examples,
# and on a tag v1.2.3 publish it as $CI_REGISTRY_IMAGE:1.2.3.
#
# Building an image inside CI needs Docker-in-Docker, i.e. a runner with
# `privileged = true`. Without one, swap the image:build job for buildah or
# build the image on a lab machine and `docker push` it (README, "Releasing").

stages: [build, test, release]

variables:
  CANDIDATE: "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"

.docker:
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

image:build:
  extends: .docker
  stage: build
  script:
    - docker build --pull -t "$CANDIDATE" .
    - docker push "$CANDIDATE"

test:examples:
  stage: test
  image: $CANDIDATE
  script:
    - tests/run_examples.sh

test:clients:
  stage: test
  image: ghcr.io/astral-sh/uv:0.12-python3.12-bookworm-slim
  needs: []
  script:
    - uv run --no-project --with pytest pytest -q tests

# The template names the image version it was released with; a tag that
# disagrees would ship a template pointing at a different toolchain.
test:template-pin:
  stage: test
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - grep -q "ghuser-builder:${CI_COMMIT_TAG#v}\"" templates/gitlab/ghuser.gitlab-ci.yml
        || { echo "set GHUSER_BUILDER_IMAGE in the template to ${CI_COMMIT_TAG#v} before tagging"; exit 1; }

release:image:
  extends: .docker
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - docker pull "$CANDIDATE"
    - docker tag "$CANDIDATE" "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
