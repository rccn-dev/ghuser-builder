# Pipeline for ghuser-builder itself: build the image, test it on the examples,
# and on a tag v1.2.3 publish it as $CI_REGISTRY_IMAGE:1.2.3.
#
# The image is built with BuildKit (moby/buildkit, rootless), which needs a
# runner that allows user namespaces: seccomp and AppArmor unconfined (or
# privileged). Only image:build needs it, so it runs on a runner tagged
# $IMAGE_BUILD_RUNNER_TAG; every other job runs on the ordinary runners.
# Runner setup: docs/runner-setup.md.

stages: [build, test, release]

variables:
  CANDIDATE: "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
  IMAGE_BUILD_RUNNER_TAG: image-build

image:build:
  stage: build
  tags: [$IMAGE_BUILD_RUNNER_TAG]
  image:
    name: moby/buildkit:v0.33.1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - mkdir -p ~/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > ~/.docker/config.json
    - buildctl-daemonless.sh build --frontend dockerfile.v0
        --local context=. --local dockerfile=.
        --output "type=image,name=$CANDIDATE,push=true"

test:examples:
  stage: test
  image: $CANDIDATE
  script:
    - tests/run_examples.sh

test:clients:
  stage: test
  image: ghcr.io/astral-sh/uv:0.12-python3.12-bookworm-slim
  needs: []
  script:
    - uv run --no-project --with pytest pytest -q tests

# The template names the image version it was released with; a tag that
# disagrees would ship a template pointing at a different toolchain.
test:template-pin:
  stage: test
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      grep -q "ghuser-builder:${CI_COMMIT_TAG#v}\"" templates/gitlab/ghuser.gitlab-ci.yml \
        || { echo "set GHUSER_BUILDER_IMAGE in the template to ${CI_COMMIT_TAG#v} before tagging"; exit 1; }

# Publish exactly the image that passed the tests -- a registry-side copy, no rebuild.
release:image:
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane copy "$CANDIDATE" "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
